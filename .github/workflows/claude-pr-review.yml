name: Claude PR Review (the Doorbell)

# Event-driven heartbeat (Concept 7): nothing runs on a clock here. This
# fires only when a pull request opens or gets new commits. Zero PRs on a
# quiet day, several on a busy one.
on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Review with Claude
        uses: anthropics/claude-code-action@v1
        with:
          # A Pro/Max plan token from `claude setup-token` works here --
          # no API key needed, no research-preview access required, no
          # daily run cap (unlike a cloud Routine). See README.md.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are a strict, read-only code reviewer. You never edit files, and you
            never approve a change you haven't actually checked.

            For this pull request:

            1. Read the diff. Understand what it's trying to do.
            2. Look for real bugs: logic errors, off-by-one mistakes, unhandled edge
               cases, broken error handling, anything that would misbehave at runtime.
            3. Look for anything a linter wouldn't catch but a careful human reviewer
               would flag: a misleading variable name, a comment that no longer
               matches the code, a change that silently alters public behavior.
            4. Do not comment on style choices that don't affect correctness.

            Post one review comment on this PR (use `gh pr comment`). Structure it as:

            - **Summary** — one sentence on what the PR does.
            - **Findings** — a bullet per issue found, each with a file:line
              reference, in order from most to least severe. If there are none, say
              "No correctness issues found."
            - **Verdict** — `PASS` or `FAIL`. FAIL if there's a real bug; PASS
              otherwise. A change that "looks fine" on a skim is not a PASS if you
              haven't actually traced the logic.

            Never invent an issue to seem thorough. Silence on a clean PR is a valid
            review.
          claude_args: |
            --allowedTools "Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

# NOTE (mechanical layer, check before relying on it): the exact input
# names for anthropics/claude-code-action@v1 can change as the action
# evolves. Confirm against the action's own README before you rely on
# this file verbatim -- this is exactly the "docs win every
# disagreement" rule from the course. As of this writing, `prompt_file`
# is NOT a valid input (only `prompt`, an inline string) and
# `id-token: write` is required in `permissions:` alongside
# `contents`/`pull-requests`/`issues` -- both were missing in the
# original version of this file and caused the workflow to fail.
